name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    # Needs a staging ReleaseDesk instance: set the RD_URL variable and RD_TOKEN secret (read scope).
    if: ${{ vars.RD_URL != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Revoke without a release id must fail
        id: negative
        continue-on-error: true
        uses: ./
        with:
          command: revoke
          server-url: ${{ vars.RD_URL }}
          token: ${{ secrets.RD_TOKEN }}
      - name: Assert failure
        shell: bash
        run: '[ "${{ steps.negative.outcome }}" = failure ]'
